<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Way More Fish — Fish Now Top 3 Upgrade</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1520;color:#eef6fb;margin:0;padding:24px}
.card{max-width:720px;margin:auto;background:#132332;border:1px solid #38566d;border-radius:16px;padding:20px}
button{font:inherit;border:1px solid #38566d;border-radius:10px;background:#0b668d;color:#fff;padding:12px 16px;font-weight:800}
.small{font-size:13px;color:#9fb0bf;line-height:1.45}
.ok{color:#7bdc7b}.bad{color:#ff8585}
code{background:#0d1c28;padding:2px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="card">
<h2>Way More Fish — Fish Now Top 3 Upgrade</h2>
<p>This takes the <strong>current</strong> GitHub <code>index.html</code>, adds the new map-first Fish Now experience, and creates a new <code>index.html</code> for you to upload.</p>
<p class="small">It does not change GitHub directly. It preserves whatever is currently in the repo and applies only this upgrade.</p>
<button id="go" onclick="makeFile()">Create upgraded index.html</button>
<div id="status" class="small" style="margin-top:12px">Ready.</div>
</div>
<script>
const RAW="https://raw.githubusercontent.com/leetrout1965-lee/Way-more-fish/main/index.html";

function replaceOnce(html,oldText,newText,label){
 if(!html.includes(oldText)) throw new Error("Could not find "+label+". The live file may have changed.");
 return html.replace(oldText,newText);
}

function applyUpgrade(html){
 if(html.includes("const FishNowControl=L.Control.extend") && html.includes("function gamePlanForRankedSpot(")){
   throw new Error("Fish Now Top 3 is already installed.");
 }

 html=html.replace("</style>",`
.wmf-fish-now-control{display:none}
.fish-now-pin{
 width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:#eef6fb;border:3px solid #0b1520;color:#0b1520;font-weight:900;font-size:16px;
 box-shadow:0 2px 9px rgba(0,0,0,.55)
}
.fish-now-pin.good{background:#7bdc7b}
.fish-now-pin.mid{background:#ffd166}
.fish-now-pin.low{background:#d8dee4}
.fish-now-halo{pointer-events:none}
.wmf-game-plan{min-width:245px;max-width:310px}
.wmf-game-plan .gp-score{font-size:24px;font-weight:900;margin:2px 0 6px}
.wmf-game-plan .gp-row{margin:5px 0;line-height:1.3}
.wmf-game-plan .gp-label{font-weight:800}
@media (max-width:1600px), (hover:none) and (pointer:coarse){
 .wmf-fish-now-control{display:block}
 .wmf-fish-now-control button{
   border:0;border-radius:12px;background:#17834a;color:#fff;
   font-weight:900;font-size:15px;padding:10px 13px;box-shadow:0 3px 10px #0008
 }
}
</style>`);

 const mapAnchor='const map=L.map("map").setView([29.55,-91.88],9);';
 html=replaceOnce(html,mapAnchor,`
let latestFishNowTop=[];

function fishNowRating(score){
 return score>=80?"Very good":score>=70?"Good":score>=55?"Fair":"Marginal";
}
function fishNowClass(score){
 return score>=75?"good":score>=60?"mid":"low";
}
function gamePlanStart(r){
 const fit=r&&r.water&&r.water.fit&&Array.isArray(r.water.fit.best)?r.water.fit.best:[];
 const target=fit.length?String(fit[0]).toLowerCase():"";
 const ctx=structureDetails[r.spot.name]||{};
 const st=String(ctx.type||"").toLowerCase();
 if(target.includes("redfish"))return /weir|marsh|drain|shoreline/.test(st)?"3–4 in paddle tail or weedless spoon":"3–4 in paddle tail on 1/4 oz jig";
 if(target.includes("flounder"))return "3–4 in soft plastic worked close to bottom";
 if(target.includes("sheepshead"))return "Shrimp or small crustacean bait tight to structure";
 if(/deep|ledge|channel|pass/.test(st))return "3–4 in paddle tail on 3/8 oz jig; adjust for current";
 if(/reef|shell|oyster|hard bottom/.test(st))return "3–4 in paddle tail on 1/4 oz jig; work the edge";
 return "3–4 in paddle tail on 1/4 oz jig";
}
function gamePlanWindow(r){
 const w=r&&r.bestWindows&&r.bestWindows.best;
 if(!w)return "No reliable 12-hour window yet";
 return \`\${fmtHour(w.start)}–\${fmtHour(w.end)} • \${w.score}/100\`;
}
function gamePlanForRankedSpot(r,rank){
 const ctx=structureDetails[r.spot.name]||{};
 const reasons=(r.now&&r.now.reasons||[]).slice(0,4);
 const water=r.clarity&&Number.isFinite(r.clarity.score)?\`\${r.clarity.label} • \${Math.round(r.clarity.score)}/100\`:\`Water signal \${r.now.cleanScore}/100\`;
 const setup=ctx.how||"Start on the current-facing edge or depth change; reposition after 10–15 minutes if bait or fish are absent.";
 const structure=ctx.type||"Local fishing structure";
 return \`
 <div class="wmf-game-plan">
   <strong>#\${rank} \${r.spot.name}</strong>
   <div class="small muted">\${r.spot.area}</div>
   <div class="gp-score">\${r.now.score}/100 • \${fishNowRating(r.now.score)}</div>
   <div class="gp-row"><span class="gp-label">Best window:</span> \${gamePlanWindow(r)}</div>
   <div class="gp-row"><span class="gp-label">Why now:</span> \${reasons.join(" • ")||"Current conditions fit"}</div>
   <div class="gp-row"><span class="gp-label">Water:</span> \${water}</div>
   <div class="gp-row"><span class="gp-label">Structure:</span> \${structure}</div>
   <div class="gp-row"><span class="gp-label">Set up:</span> \${setup}</div>
   <div class="gp-row"><span class="gp-label">Start with:</span> \${gamePlanStart(r)}</div>
   <div class="gp-row"><span class="gp-label">Confidence:</span> \${r.confidence}</div>
   <button class="primary" style="margin-top:8px" onclick="viewSpotOnMap(\${spots.indexOf(r.spot)})">Load this spot</button>
   <div class="small muted" style="margin-top:7px">Conditions recommendation, not a catch guarantee.</div>
 </div>\`;
}
async function runFishNowMap(){
 if(typeof closeFishingToolsMenu==="function")closeFishingToolsMenu();
 if(typeof closeFishingTool==="function")closeFishingTool();
 const b=document.getElementById("wmfFishNowBtn");
 if(b){b.disabled=true;b.textContent="Scanning…";}
 try{
   await findWhereNow();
   if(latestFishNowTop.length){
     setTimeout(()=>{
       whereNowLayer.eachLayer(layer=>{
         if(layer&&layer._wmfRank===1&&layer.openPopup)layer.openPopup();
       });
     },180);
   }
 }finally{
   if(b){b.disabled=false;b.textContent="🎯 Fish Now";}
 }
}
`+mapAnchor,"map creation anchor");

 const toolsAnchor='const FishingToolsControl=L.Control.extend({';
 html=replaceOnce(html,toolsAnchor,`
const FishNowControl=L.Control.extend({
 options:{position:"bottomright"},
 onAdd:function(){
  const box=L.DomUtil.create("div","wmf-fish-now-control leaflet-control");
  const btn=L.DomUtil.create("button","",box);
  btn.id="wmfFishNowBtn";
  btn.type="button";
  btn.innerHTML="🎯 Fish Now";
  btn.title="Scan current conditions and show the top 3 spots";
  L.DomEvent.disableClickPropagation(box);
  L.DomEvent.on(btn,"click",e=>{L.DomEvent.preventDefault(e);runFishNowMap();});
  return box;
 }
});
map.addControl(new FishNowControl());

`+toolsAnchor,"Fishing Tools control anchor");

 const oldRender=/function renderWhereNowPins\(top\)\{[\s\S]*?\n\}\nasync function findWhereNow\(\)\{/;
 if(!oldRender.test(html))throw new Error("Could not find the current Fish Now map-pin function.");
 html=html.replace(oldRender,`function renderWhereNowPins(top){
 whereNowLayer.clearLayers();
 latestFishNowTop=top.slice();
 const bounds=[];
 top.forEach((r,i)=>{
  const rank=i+1,cls=fishNowClass(r.now.score);
  const halo=L.circleMarker([r.spot.lat,r.spot.lon],{
   radius:22,weight:2,color:r.now.score>=75?"#2f9e58":r.now.score>=60?"#c59725":"#79838d",
   fillColor:r.now.score>=75?"#7bdc7b":r.now.score>=60?"#ffd166":"#d8dee4",
   fillOpacity:.18,className:"fish-now-halo",interactive:false
  });
  whereNowLayer.addLayer(halo);
  const icon=L.divIcon({
   className:"",
   html:\`<div class="fish-now-pin \${cls}">\${rank}</div>\`,
   iconSize:[34,34],iconAnchor:[17,17]
  });
  const marker=L.marker([r.spot.lat,r.spot.lon],{icon})
   .bindPopup(gamePlanForRankedSpot(r,rank),{maxWidth:340});
  marker._wmfRank=rank;
  whereNowLayer.addLayer(marker);
  bounds.push([r.spot.lat,r.spot.lon]);
 });
 if(bounds.length)map.fitBounds(bounds,{padding:[55,55],maxZoom:10});
}
async function findWhereNow(){`);

 html=html.replaceAll("geographically diverse final Top 5","geographically diverse final Top 3");
 html=html.replaceAll("coast-wide Top 5","coast-wide Top 3");

 const topLine=/const top=\[\.\.\.bestByArea\.values\(\)\]\.sort\(\(a,b\)=>b\.now\.score-a\.now\.score\|\|b\.now\.cleanScore-a\.now\.cleanScore\|\|a\.spot\.name\.localeCompare\(b\.spot\.name\)\)\.slice\(0,5\);/;
 if(!topLine.test(html))throw new Error("Could not find the Top 5 selection line.");
 html=html.replace(topLine,'const top=[...bestByArea.values()].sort((a,b)=>b.now.score-a.now.score||b.now.cleanScore-a.now.cleanScore||a.spot.name.localeCompare(b.spot.name)).slice(0,3);');

 html=html.replaceAll("Top 5 use one spot per area and are pinned on the map.","Top 3 use one spot per area and are pinned on the map with tap-to-open Game Plans.");
 html=html.replaceAll("Top 5 intentionally uses one spot per area","Top 3 intentionally uses one spot per area");
 html=html.replace('>Best Areas Now</button>','>Fish Now — Top 3</button>');

 const required=[
  "const FishNowControl=L.Control.extend",
  "function gamePlanForRankedSpot",
  ".slice(0,3);",
  "Top 3 use one spot per area",
  "fish-now-pin",
  'id="wmfSpotsBtn"',
  "☰ Tools",
  "function pressureToHpa(v)"
 ];
 for(const x of required){
   if(!html.includes(x))throw new Error("Validation failed: "+x);
 }
 return html;
}

async function makeFile(){
 const btn=document.getElementById("go");
 const status=document.getElementById("status");
 btn.disabled=true;
 status.className="small";
 status.textContent="Getting the current index.html from GitHub…";
 try{
  const r=await fetch(RAW,{cache:"no-store"});
  if(!r.ok)throw new Error("GitHub returned HTTP "+r.status);
  const current=await r.text();
  status.textContent="Applying Fish Now Top 3 + Game Plan upgrade…";
  const upgraded=applyUpgrade(current);
  const blob=new Blob([upgraded],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="index.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  status.className="small ok";
  status.textContent="Done. A new index.html was created from the current GitHub version.";
 }catch(e){
  status.className="small bad";
  status.textContent="Could not create the upgrade: "+e.message;
 }finally{
  btn.disabled=false;
 }
}
</script>
</body>
</html>
