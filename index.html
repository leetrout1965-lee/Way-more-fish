<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Way More Fish — Create Fixed index.html</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1520;color:#eef6fb;margin:0;padding:24px}
.card{max-width:720px;margin:auto;background:#132332;border:1px solid #284153;border-radius:16px;padding:20px}
button{font:inherit;padding:14px 18px;border-radius:10px;border:1px solid #3289aa;background:#0b668d;color:white;font-weight:700}
.small{color:#9fb0bf;font-size:14px;line-height:1.45}
#status{margin-top:14px;white-space:pre-wrap}
.good{color:#7bdc7b}.bad{color:#ff8585}
</style>
</head>
<body>
<div class="card">
<h2>Way More Fish — Big Lake / Calcasieu Fix</h2>
<p>This makes a corrected <strong>index.html</strong> from the current GitHub version. It does not change GitHub by itself.</p>
<button id="go">Create fixed index.html</button>
<div id="status" class="small">Tap the button once. Safari will create the corrected file for you.</div>
</div>
<script>
const RAW="https://raw.githubusercontent.com/leetrout1965-lee/Way-more-fish/main/index.html";

function applyFix(html){
  const anchor='const allAreas=[...new Set(spots.map(s=>s.area))];';
  if(!html.includes(anchor)) throw new Error("Could not find the expected area-list code. The GitHub file may have changed.");

  html=html.replace(anchor, `const allAreas=["Big Lake / Calcasieu",...new Set(spots.map(s=>s.area))];
function indexedSpotsForArea(area){
 return spots.map((s,i)=>({s,i})).filter(x=>
  area==="Big Lake / Calcasieu"
   ? ["West Cove","Hackberry"].includes(x.s.area)
   : x.s.area===area
 );
}
function areaSpotObjects(area){
 return indexedSpotsForArea(area).map(x=>x.s);
}`);

  const oldMatches='const matches=spots.map((s,i)=>({s,i})).filter(x=>x.s.area===area);';
  if(!html.includes(oldMatches)) throw new Error("Could not find the spot-picker code.");
  html=html.replace(oldMatches,'const matches=indexedSpotsForArea(area);');

  // Make every area-wide feature understand Big Lake / Calcasieu as the
  // combined West Cove + Hackberry group.
  html=html.replaceAll('spots.filter(s=>s.area===area)','areaSpotObjects(area)');

  // When a Big Lake spot is selected, keep Big Lake / Calcasieu selected
  // instead of immediately switching the area selector to West Cove/Hackberry.
  const oldSelect='const idx=spots.indexOf(s);if(s.area&&areaPicker.value!==s.area){areaPicker.value=s.area;showArea(s.area);}if(idx>=0)document.getElementById("locationPicker").value=String(idx);';
  if(html.includes(oldSelect)){
    html=html.replace(oldSelect, `const idx=spots.indexOf(s);
 const bigLakeAlias=areaPicker.value==="Big Lake / Calcasieu"&&["West Cove","Hackberry"].includes(s.area);
 if(s.area&&areaPicker.value!==s.area&&!bigLakeAlias){areaPicker.value=s.area;showArea(s.area);}
 if(idx>=0)document.getElementById("locationPicker").value=String(idx);`);
  }

  // A marker so we can tell the fixed version from the old one.
  html=html.replace('<title>Way More Fish</title>','<title>Way More Fish</title>\\n<!-- Big Lake / Calcasieu picker fix applied 2026-09-24 -->');

  return html;
}

async function makeFile(){
  const status=document.getElementById("status");
  const btn=document.getElementById("go");
  btn.disabled=true;
  status.className="small";
  status.textContent="Getting the current index.html from GitHub…";
  try{
    const r=await fetch(RAW,{cache:"no-store"});
    if(!r.ok) throw new Error("GitHub returned HTTP "+r.status);
    const original=await r.text();
    const fixed=applyFix(original);

    // Basic verification before offering the file.
    if(!fixed.includes('const matches=indexedSpotsForArea(area);')) throw new Error("Picker fix verification failed.");
    if(!fixed.includes('area==="Big Lake / Calcasieu"')) throw new Error("Big Lake alias verification failed.");
    if(fixed.length < 100000) throw new Error("The downloaded index looks incomplete.");

    const blob=new Blob([fixed],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);

    status.className="small good";
    status.textContent="✓ Fixed index.html created. Look in Safari Downloads / Files. This version makes Big Lake / Calcasieu populate with the existing West Cove and Hackberry spots.";
  }catch(e){
    status.className="small bad";
    status.textContent="Could not create the file: "+e.message+"\\n\\nIf Safari blocks the GitHub fetch, open GitHub first and make sure you are online, then try again.";
  }finally{
    btn.disabled=false;
  }
}
document.getElementById("go").addEventListener("click",makeFile);
</script>
</body>
</html>
